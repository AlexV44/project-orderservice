name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B -ntp verify

  docker:
    name: Docker image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t order-service:${{ github.sha }} .